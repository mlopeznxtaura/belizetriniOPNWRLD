<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>html,body{margin:0;background:#87b8d8;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script type="importmap">
{"imports":{
  "three":"/vendor/three/three.module.js",
  "three/addons/":"/vendor/three/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const url = params.get('url') || '/assets/characters/male.glb';
const w = 240, h = 280;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(w, h);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x87b8d8, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8d8);
const camera = new THREE.PerspectiveCamera(35, w/h, 0.1, 100);
camera.position.set(0.55, 1.35, -3.0);
camera.lookAt(0, 0.95, 0);

// Explicit Ambient + Hemisphere + key — MeshStandardMaterial needs lights
scene.add(new THREE.AmbientLight(0xfff5e8, 0.95));
scene.add(new THREE.HemisphereLight(0xb8e0ff, 0x6a8a50, 0.7));
const sun = new THREE.DirectionalLight(0xfff2d6, 1.25);
sun.position.set(2.5, 5, 3);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xc8e0ff, 0.35);
fill.position.set(-2, 2, -1);
scene.add(fill);

function ensureStock(mat) {
  if (!mat) return;
  mat.metalness = Math.min(mat.metalness ?? 0, 0.08);
  if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace;
}

const loader = new GLTFLoader();
const gltf = await loader.loadAsync(url);
const model = gltf.scene;
model.traverse((o) => {
  if (o.isMesh && o.material) {
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      m.side = THREE.FrontSide;
      ensureStock(m);
    }
  }
});
let box = new THREE.Box3().setFromObject(model);
const size = new THREE.Vector3();
box.getSize(size);
if (size.z >= size.y && size.z >= size.x) {
  model.rotation.x = -Math.PI / 2;
  box = new THREE.Box3().setFromObject(model);
  box.getSize(size);
}
const s = 1.8 / Math.max(size.y, 0.01);
model.scale.setScalar(s);
box.setFromObject(model);
model.position.y = -box.min.y;
// Face camera (camera is at -Z); female Mixamo often needs +PI after Z-up fix
model.rotation.y = /female/i.test(url) ? Math.PI * 1.15 : Math.PI * 0.15;
scene.add(model);

const idle = (gltf.animations || []).find(c => /idle/i.test(c.name));
if (idle) {
  const mixer = new THREE.AnimationMixer(model);
  const act = mixer.clipAction(idle);
  act.play();
  mixer.update(0.35);
}

renderer.render(scene, camera);
document.title = 'READY';
window.__SHOT__ = renderer.domElement.toDataURL('image/png');
</script>
</body>
</html>
